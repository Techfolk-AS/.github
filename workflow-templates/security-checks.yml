name: Security Checks

on:
  push:
    branches: [$default-branch]
  pull_request:
    branches: [$default-branch]
  schedule:
    - cron: "0 8 * * 1" # Weekly on Monday at 08:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    name: Secret Scanning
    uses: Techfolk-AS/.github/.github/workflows/reusable-gitleaks.yml@main
    secrets: inherit

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    uses: Techfolk-AS/.github/.github/workflows/reusable-dependency-review.yml@main
    with:
      fail-on-severity: "high"

  codeql:
    name: CodeQL
    uses: Techfolk-AS/.github/.github/workflows/reusable-codeql.yml@main
    # Update the languages array to match your repo
    with:
      languages: '["javascript-typescript"]'
    permissions:
      security-events: write
      actions: read
      contents: read
