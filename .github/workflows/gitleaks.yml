name: Gitleaks Org Scan

on:
  schedule:
    - cron: "0 8 * * 1-5" # Weekdays at 08:00 UTC
  workflow_dispatch:

jobs:
  list-repos:
    name: List org repos
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.repos.outputs.include }}
    steps:
      - name: Get all repos
        id: repos
        env:
          GH_TOKEN: ${{ secrets.ORG_PAT }}
        run: |
          include=$(gh repo list Techfolk-AS --no-archived --json name,defaultBranchRef --jq '[.[] | select(.defaultBranchRef.name != "") | {repo: .name, branch: .defaultBranchRef.name}]' --limit 200)
          echo "include=$include" >> "$GITHUB_OUTPUT"

  scan:
    name: "Scan: ${{ matrix.repo }}"
    needs: list-repos
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.list-repos.outputs.include) }}
    steps:
      - name: Checkout ${{ matrix.repo }}
        uses: actions/checkout@v6
        with:
          repository: Techfolk-AS/${{ matrix.repo }}
          ref: ${{ matrix.branch }}
          token: ${{ secrets.ORG_PAT }}
          fetch-depth: 0

      - name: Install Gitleaks
        env:
          GH_TOKEN: ${{ secrets.ORG_PAT }}
        run: |
          VERSION=$(gh release view --repo gitleaks/gitleaks --json tagName --jq '.tagName' | sed 's/^v//')
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" | tar xz
          sudo mv gitleaks /usr/local/bin/

      - name: Run Gitleaks
        run: gitleaks detect --source . --verbose --exit-code 1

  notify:
    name: Notify on failure
    needs: [list-repos, scan]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack notification
        uses: slackapi/slack-github-action@v2
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ secrets.SLACK_CHANNEL_ID }}
            text: ":rotating_light: *Gitleaks scan failed*\nThe daily org-wide secret scan found issues in one or more repositories.\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
