name: Grype Org Scan

on:
  schedule:
    - cron: "0 6 * * 1-5" # Weekdays at 06:00 UTC
  workflow_dispatch:

jobs:
  list-repos:
    name: List org repos
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.repos.outputs.include }}
    steps:
      - name: Get all repos
        id: repos
        env:
          GH_TOKEN: ${{ secrets.ORG_PAT }}
        run: |
          include=$(gh repo list Techfolk-AS --no-archived --json name,defaultBranchRef --jq '[.[] | select(.defaultBranchRef.name != "") | {repo: .name, branch: .defaultBranchRef.name}]' --limit 200)
          echo "include=$include" >> "$GITHUB_OUTPUT"

  scan:
    name: "Scan: ${{ matrix.repo }}"
    needs: list-repos
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.list-repos.outputs.include) }}
    steps:
      - name: Checkout ${{ matrix.repo }}
        uses: actions/checkout@v6
        with:
          repository: Techfolk-AS/${{ matrix.repo }}
          ref: ${{ matrix.branch }}
          token: ${{ secrets.ORG_PAT }}

      - name: Run Grype
        uses: anchore/scan-action@v7
        with:
          path: .
          severity-cutoff: high
          only-fixed: true
          fail-build: true
          output-format: table

  notify:
    name: Notify on failure
    needs: [list-repos, scan]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack notification
        uses: slackapi/slack-github-action@v2
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ secrets.SLACK_CHANNEL_ID }}
            text: ":rotating_light: *Grype scan failed*\nThe daily org-wide vulnerability scan found issues in one or more repositories.\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
