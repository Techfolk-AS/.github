name: Dependency Review

on:
  workflow_call:
    inputs:
      fail-on-severity:
        description: "Minimum severity to fail on (low, moderate, high, critical)"
        required: false
        default: "high"
        type: string
      deny-licenses:
        description: "Comma-separated list of licenses to deny (e.g. GPL-3.0, AGPL-3.0)"
        required: false
        default: ""
        type: string

jobs:
  dependency-review:
    name: Review dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: ${{ inputs.fail-on-severity }}
          deny: ${{ inputs.deny-licenses }}
