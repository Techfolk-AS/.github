name: CodeQL Org Scan

on:
  schedule:
    - cron: "0 4 * * *" # Daily at 04:00 UTC
  workflow_dispatch:

jobs:
  list-repos:
    name: List org repos
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.repos.outputs.include }}
    steps:
      - name: Get all repos
        id: repos
        env:
          GH_TOKEN: ${{ secrets.ORG_PAT }}
        run: |
          include=$(gh repo list Techfolk-AS --no-archived --json name,defaultBranchRef,languages --jq '
            [.[] | select(.defaultBranchRef.name != "") |
              .name as $repo | .defaultBranchRef.name as $branch |
              [.languages[].node.name] | map(
                if . == "JavaScript" or . == "TypeScript" then "javascript-typescript"
                elif . == "Java" or . == "Kotlin" then "java-kotlin"
                elif . == "C" or . == "C++" then "cpp"
                elif . == "C#" then "csharp"
                elif . == "Python" then "python"
                elif . == "Go" then "go"
                elif . == "Ruby" then "ruby"
                elif . == "Swift" then "swift"
                else empty
                end
              ) | unique | .[] | {repo: $repo, branch: $branch, language: .}
            ]
          ' --limit 200)
          echo "include=$include" >> "$GITHUB_OUTPUT"

  scan:
    name: "Scan: ${{ matrix.repo }} (${{ matrix.language }})"
    needs: list-repos
    if: ${{ needs.list-repos.outputs.include != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.list-repos.outputs.include) }}
    steps:
      - name: Checkout ${{ matrix.repo }}
        uses: actions/checkout@v4
        with:
          repository: Techfolk-AS/${{ matrix.repo }}
          ref: ${{ matrix.branch }}
          token: ${{ secrets.ORG_PAT }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@v3
