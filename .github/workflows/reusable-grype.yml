name: Grype PR Scan

on:
  workflow_call:

jobs:
  grype:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run Grype
        uses: anchore/scan-action@v7
        with:
          path: .
          severity-cutoff: high
          only-fixed: true
          fail-build: true
          output-format: table
