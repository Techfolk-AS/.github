name: Gitleaks Secret Scanning

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      scan-mode:
        description: "Scan mode: 'protect' (staged/changed files) or 'detect' (full history)"
        required: false
        default: "protect"
        type: string

jobs:
  gitleaks:
    name: Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
